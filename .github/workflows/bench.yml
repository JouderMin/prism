name: Bench

# 只在手动触发时跑，避免占用 Actions 额度。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            slug: macos-arm64
            os: macos-26
            triplet: arm64-osx
            generator: Ninja
            generator_args: ""
            bench_binary: ./build/ci/PrismBench
          - name: Windows x64
            slug: windows-x64
            os: windows-2022
            triplet: x64-windows
            generator: Visual Studio 17 2022
            generator_args: -A x64
            bench_binary: ./build/ci/Release/PrismBench.exe
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create vcpkg binary cache directory
        shell: bash
        run: mkdir -p vcpkg-cache

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ matrix.triplet }}-juce-8.0.7
          restore-keys: |
            vcpkg-${{ matrix.triplet }}-

      - name: Clone vcpkg
        shell: bash
        run: git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg

      - name: Bootstrap vcpkg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Install JUCE
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./vcpkg/vcpkg.exe install juce --triplet ${{ matrix.triplet }}
          else
            ./vcpkg/vcpkg install juce --triplet ${{ matrix.triplet }}
          fi

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build/ci \
            -G "${{ matrix.generator }}" ${{ matrix.generator_args }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DPRISM_BUILD_AU=OFF \
            -DPRISM_BUILD_BENCH=ON \
            -DPRISM_COPY_PLUGINS=OFF

      - name: Build PrismBench
        shell: bash
        run: cmake --build build/ci --config Release --target PrismBench --parallel

      - name: Run PrismBench
        shell: bash
        run: ${{ matrix.bench_binary }} | tee bench-${{ matrix.slug }}.txt

      - name: Upload bench output
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.slug }}
          path: bench-${{ matrix.slug }}.txt
          if-no-files-found: error
